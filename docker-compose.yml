# Infraestrutura local: MySQL, Adminer (visualizar o banco) e Mailpit (SMTP de teste).
# Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: seguradora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: seguradora
      MYSQL_USER: seguradora
      MYSQL_PASSWORD: seguradora
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    container_name: seguradora-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: seguradora-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web

volumes:
  mysql-data:
